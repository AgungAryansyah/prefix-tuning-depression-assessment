[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prefix-tuning-depression-assessment"
version = "0.1.0"
description = "Reproduction of Lau et al. (2023): prefix-tuning for depression severity assessment on DAIC-WOZ."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.3",
    "transformers>=4.45,<5",
    "peft>=0.13",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
